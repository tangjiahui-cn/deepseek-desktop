name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, for example v0.2.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve tag and version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = "$VERSION" ]; then
            echo "Tag '$TAG' must start with v" >&2
            exit 1
          fi
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag '$TAG' does not match package.json version '$PKG_VERSION'" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm type

      - name: Lint
        run: pnpm lint

      - name: Build renderer and Electron main
        run: pnpm build:desktop

      - name: Package (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --mac --x64 --arm64 --publish never

      - name: Package (Windows)
        if: matrix.platform == 'win'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --win --x64 --publish never

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: pnpm exec electron-builder --config electron-builder.config.cjs --linux --x64 --publish never

      - name: Verify macOS code signature
        if: matrix.platform == 'mac'
        shell: bash
        # 防止出现「外层 app 仍是 Electron 原始签名」的包：Apple Silicon 会报已损坏
        run: |
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/DeepSeek Desktop.app"
          codesign --verify --deep --strict --verbose=2 "release/mac/DeepSeek Desktop.app"

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify artifacts and update metadata
        shell: bash
        run: |
          set -euo pipefail
          ls -la artifacts
          test -f artifacts/latest.yml
          test -f artifacts/latest-mac.yml
          test -f artifacts/latest-linux.yml
          grep -q 'arm64' artifacts/latest-mac.yml
          grep -q 'x64' artifacts/latest-mac.yml
          for file in artifacts/*.dmg artifacts/*.zip artifacts/*.exe artifacts/*.AppImage artifacts/*.deb; do
            [ -f "$file" ] || { echo "Missing expected artifact: $file" >&2; exit 1; }
          done

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-* ]]; then
            PREFLAG="--prerelease"
          else
            PREFLAG=""
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --draft=false $PREFLAG
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag \
              --title "DeepSeek Desktop $TAG" \
              --generate-notes $PREFLAG
          fi
          gh release upload "$TAG" --repo "$REPO" artifacts/* --clobber
          echo "Published $TAG"
